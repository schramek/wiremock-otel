apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock
  labels:
    app.kubernetes.io/name: wiremock
    app.kubernetes.io/component: mock-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wiremock
      app.kubernetes.io/component: mock-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wiremock
        app.kubernetes.io/component: mock-server
    spec:
      containers:
        - name: wiremock
          image: wiremock-observability:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: wiremock
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
            - name: WIREMOCK_LOG_LEVEL
              value: INFO
            - name: WIREMOCK_OBSERVABILITY_LOG_LEVEL
              value: INFO
          readinessProbe:
            httpGet:
              path: /__admin/mappings
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /__admin/mappings
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
